name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Linux backend)
        run: cargo build -p trident-hal -p trident-hal-kvm -p tridentd
      - name: Test
        run: cargo test -p tridentd -- --nocapture

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (Windows backend)
        run: cargo build -p trident-hal -p trident-hal-whp -p tridentd
      - name: Build Tauri Rust shell
        run: cargo build -p tridentd-gui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend install
        working-directory: tauri-gui
        run: npm ci
      - name: Frontend build
        working-directory: tauri-gui
        run: npm run build
